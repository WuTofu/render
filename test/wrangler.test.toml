name = "render-test"
main = "../src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "*"
# Caching is disabled for tests so each request is evaluated fresh against R2
# instead of being served from the Cache API — that's what makes
# precondition/range tests deterministic across runs.
CACHE_CONTROL = "no-store"
PATH_PREFIX = ""
INDEX_FILE = ""
NOTFOUND_FILE = ""
DIRECTORY_LISTING = true
ITEMS_PER_PAGE = 1000
HIDE_HIDDEN_FILES = false
DIRECTORY_CACHE_CONTROL = "no-store"
LOGGING = false
R2_RETRIES = 0

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "test-bucket"
